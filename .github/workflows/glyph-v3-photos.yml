name: Prepare Maya glyph v3 phone test pictures
on:
  push:
    branches: [glyph-v3-open-set-experiment]
    paths:
      - 'ml/glyph_v3/create_phone_tests.py'
      - '.github/workflows/glyph-v3-photos.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glyph-v3-open-set-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset imaging dependency
        run: python -m pip install 'datasets>=4.0,<5' 'Pillow>=11,<13'
      - name: Package fixed held-out unknown sign images and known smoke tests
        run: python ml/glyph_v3/create_phone_tests.py
      - name: Commit attributed test pack for device evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v3/test_pictures
          git commit -m 'Publish v3 phone test gallery with sign-disjoint unknown signs' || exit 0
          git push origin HEAD:glyph-v3-open-set-experiment
