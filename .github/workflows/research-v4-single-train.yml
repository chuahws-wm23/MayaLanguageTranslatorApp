name: Research v4 single-glyph retraining audit

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/**'
      - '.github/workflows/research-v4-single-train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned v4 training code and unchanged baseline model
        run: |
          mkdir -p ml/glyph_v4/outputs ml/glyph_v2/outputs/transfer
          git fetch --depth=1 origin glyph-v4-expanded-training
          git show FETCH_HEAD:ml/glyph_v4/train_v4.py > ml/glyph_v4/train_v4.py
          git show FETCH_HEAD:ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt > ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt
          git fetch --depth=1 origin glyph-model-v2-experiment
          git show FETCH_HEAD:ml/glyph_v2/train.py > ml/glyph_v2/train.py
          git show FETCH_HEAD:ml/glyph_v2/train_transfer.py > ml/glyph_v2/train_transfer.py
          test -s ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU vision research dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' opencv-python-headless scikit-learn scikit-image joblib kagglehub onnx onnxruntime
      - name: Download public Kaggle font dataset for unlabelled style statistics
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          path=Path(kagglehub.dataset_download('sayantanroy10121999/mayan-glyphs-dataset'))
          assert len(list(path.rglob('*.png')))>=15000,(str(path),len(list(path.rglob('*.png'))))
          Path('/tmp/maya_kaggle_dataset_path.txt').write_text(str(path))
          print('Kaggle downloaded, images',len(list(path.rglob('*.png'))))
          PY
      - name: Train and compare v4 candidate on unchanged TWKM labels
        run: |
          python ml/research_v4_single/retrain_v4.py \
            --kaggle-dir "$(cat /tmp/maya_kaggle_dataset_path.txt)" \
            --output ml/research_v4_single/output \
            --epochs 5 --views 5
      - name: Publish verified experiment summary
        if: always()
        run: |
          if test -f ml/research_v4_single/output/evaluation.json; then
            python - <<'PY'
          import json,os
          r=json.load(open('ml/research_v4_single/output/evaluation.json'))
          s=('## Research v4 single-sign training\n\n'
             f"* Original clean validation: {r['baseline_validation']['clean_correct']}/{r['validation_originals']}\n"
             f"* Candidate clean validation: {r['candidate_validation']['clean_correct']}/{r['validation_originals']}\n"
             f"* Original synthetic stress: {r['baseline_validation']['stress_correct']}/{r['baseline_validation']['stress_total']}\n"
             f"* Candidate synthetic stress: {r['candidate_validation']['stress_correct']}/{r['candidate_validation']['stress_total']}\n"
             f"* Candidate selected: **{r['candidate_selected_by_validation_only']}**\n"
             '* **No independent phone-camera accuracy is established. Android model remains unchanged.**\n')
          print(s)
          open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(s)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MayaResearchV4SingleGlyphCandidateResearch
          path: ml/research_v4_single/output/
          if-no-files-found: warn
          retention-days: 7
