name: Validate Maya real-photo training manifest logic

on:
  push:
    branches: [fyp-development]
    paths:
      - 'dataset/scripts/validate_real_glyph_photos.py'
      - 'dataset/scripts/test_validate_real_glyph_photos.py'
      - '.github/workflows/maya-real-photo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo validation libraries
        run: python -m pip install Pillow numpy
      - name: Test duplicate, provenance, label and sample-count safeguards
        run: python -m unittest discover -s dataset/scripts -p "test_validate_real_glyph_photos.py" -v
