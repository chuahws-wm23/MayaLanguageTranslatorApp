name: Evaluate TWKM open-set template image gallery

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/template_gallery_experiment.py'
      - '.github/workflows/maya-template-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned TWKM dataset and processing scripts
        run: |
          mkdir -p ml/glyph_v4/outputs ml/glyph_v2
          git fetch --depth=1 origin glyph-v4-expanded-training
          git show FETCH_HEAD:ml/glyph_v4/train_v4.py > ml/glyph_v4/train_v4.py
          git fetch --depth=1 origin glyph-model-v2-experiment
          git show FETCH_HEAD:ml/glyph_v2/train.py > ml/glyph_v2/train.py
          git show FETCH_HEAD:ml/glyph_v2/train_transfer.py > ml/glyph_v2/train_transfer.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5' 'Pillow>=11,<13' opencv-python-headless scikit-learn scikit-image joblib
      - name: Check Python syntax
        run: |
          python -m py_compile ml/research_v4_single/template_gallery_experiment.py
      - name: Evaluate reference matching and out-of-class rejection
        run: |
          python ml/research_v4_single/template_gallery_experiment.py
      - name: Publish actual held-out results
        run: |
          {
            echo "## Reference gallery (research, not deployed)"
            echo
            echo '~~~'
            cat ml/research_v4_single/template_match_results/summary.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Maya-TWKM-Template-Matching-Research
          path: ml/research_v4_single/template_match_results/
          if-no-files-found: warn
          retention-days: 14
