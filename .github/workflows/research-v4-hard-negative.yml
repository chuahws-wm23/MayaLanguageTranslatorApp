name: Train Research v4 hard-negative discriminative candidate

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/train_hard_negative_v4.py'
      - '.github/workflows/research-v4-hard-negative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned TWKM trainer and original v4 weights
        run: |
          mkdir -p ml/glyph_v4/outputs ml/glyph_v2/outputs/transfer
          git fetch --depth=1 origin glyph-v4-expanded-training
          git show FETCH_HEAD:ml/glyph_v4/train_v4.py > ml/glyph_v4/train_v4.py
          git show FETCH_HEAD:ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt > ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt
          git fetch --depth=1 origin glyph-model-v2-experiment
          git show FETCH_HEAD:ml/glyph_v2/train.py > ml/glyph_v2/train.py
          git show FETCH_HEAD:ml/glyph_v2/train_transfer.py > ml/glyph_v2/train_transfer.py
          test -s ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU vision libraries
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' opencv-python-headless scikit-learn scikit-image joblib kagglehub
      - name: Download Kaggle font images (unlabelled augmentation ONLY)
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          directory=Path(kagglehub.dataset_download('sayantanroy10121999/mayan-glyphs-dataset'))
          assert len(list(directory.rglob('*.png')))>=15000
          Path('/tmp/kaggle_font_path').write_text(str(directory))
          PY
      - name: Train class-balanced hard-positive and hard-negative v4 candidate
        run: |
          python ml/research_v4_single/train_hard_negative_v4.py \
            --kaggle-dir "$(cat /tmp/kaggle_font_path)" \
            --output ml/research_v4_single/hard_negative_output \
            --epochs 8 --batches 16
      - name: Summarize improvement gate
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('ml/research_v4_single/hard_negative_output/results.json'))
          base=r['baseline_validation']
          new=r['candidate_validation']
          s=('## Research v4 visual differentiation\n\n'
            f"- Baseline clean: {base['clean_correct']}/{base['clean_total']}\n"
            f"- Candidate clean: {new['clean_correct']}/{new['clean_total']}\n"
            f"- Baseline synthetic style stress: {base['stress_correct']}/{base['stress_total']}\n"
            f"- Candidate synthetic style stress: {new['stress_correct']}/{new['stress_total']}\n"
            f"- Candidate selected: {r['candidate_passed_validation_gate']}\n"
            "- No independent phone-photo or epigraphic reading accuracy has been established.\n")
          print(s)
          open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchV4HardNegativeComparison
          path: ml/research_v4_single/hard_negative_output/
          retention-days: 14
