name: Prepare CC BY TWKM phonogram drawing research pack

on:
  workflow_dispatch:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/syllabary_ml/export_twkm_licensed_phonograms.py'
      - '.github/workflows/maya-twkm-licensed-phonogram-pack.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=4,<5' 'Pillow>=11,<13'
      - name: Export only attributed, explicitly CC BY 4.0 TWKM standardized drawings
        run: |
          python -m py_compile ml/syllabary_ml/export_twkm_licensed_phonograms.py
          python ml/syllabary_ml/export_twkm_licensed_phonograms.py
      - name: Attach licensed images for private research comparison
        uses: actions/upload-artifact@v4
        with:
          name: TWKM-CCBY-Phonogram-Sign-References
          path: ml/syllabary_ml/output/twkm_licensed_phonograms/
          retention-days: 7
          if-no-files-found: error
