name: Check local Maya v11 visual reference lookup

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_roboflow_v11/reference_matcher.py'
      - 'ml/research_roboflow_v11/test_reference_matcher.py'
      - '.github/workflows/maya-v11-reference-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal vision dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" opencv-python-headless
      - name: Compile and run synthetic visual-matcher tests
        run: |
          python -m py_compile ml/research_roboflow_v11/reference_matcher.py
          python -m unittest discover -s ml/research_roboflow_v11 -p 'test_reference_matcher.py' -v
