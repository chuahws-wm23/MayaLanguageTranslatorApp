name: Verify Maya independent photo accuracy scoring

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/evaluate_heldout_photos.py'
      - 'ml/research_v4_single/test_evaluate_heldout_photos.py'
      - '.github/workflows/maya-photo-accuracy-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric evaluation dependencies (no real photos on CI)
        run: python -m pip install numpy Pillow opencv-python-headless scikit-learn
      - name: Unit-test real-photo accuracy and uncertainty gates
        run: python -m unittest discover -s ml/research_v4_single -p "test_evaluate_heldout_photos.py" -v
