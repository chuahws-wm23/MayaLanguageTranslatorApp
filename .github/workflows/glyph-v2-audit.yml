name: Maya glyph v2 dataset availability audit
on:
  push:
    branches: [glyph-model-v2-experiment]
    paths:
      - 'ml/glyph_v2/audit.py'
      - '.github/workflows/glyph-v2-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'datasets>=4.0,<5' Pillow
      - name: Audit original glyph drawings; no augmentation
        run: python ml/glyph_v2/audit.py
      - name: Commit audit statistics without source images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v2/audit.json
          git commit -m 'Record pinned TWKM sign-variant audit' || exit 0
          git push origin HEAD:glyph-model-v2-experiment
