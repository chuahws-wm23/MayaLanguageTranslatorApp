name: Maya glyph v2 pretrained feature comparison
on:
  push:
    branches: [glyph-model-v2-experiment]
    paths:
      - 'ml/glyph_v2/train_transfer.py'
      - '.github/workflows/glyph-v2-transfer.yml'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only pretrained image models
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install glyph and ML libraries
        run: python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' scikit-learn scikit-image opencv-python-headless joblib
      - name: Compare pretrained embeddings on source-separated folds
        run: python ml/glyph_v2/train_transfer.py
      - name: Summarize original-image CV results
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('ml/glyph_v2/outputs/transfer/evaluation.json'))
          lines=['## Five-fold original-image CV — exploratory, NOT phone-photo accuracy','']
          for model in x['models']:
              lines.append(f"* {model['backbone']} + {model['method']}: {model['out_of_fold_correct']}/{model['out_of_fold_original_count']} = {model['out_of_fold_accuracy']:.1%}")
          lines.append('')
          lines.append('This is not a fully untouched external benchmark. Original drawings are grouped by source ID within folds.')
          open(os.environ['GITHUB_STEP_SUMMARY'],'a').write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Save pretrained research baseline only to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v2/outputs/transfer/
          git commit -m 'Record Maya glyph transfer-learning comparisons' || exit 0
          git push origin HEAD:glyph-model-v2-experiment
