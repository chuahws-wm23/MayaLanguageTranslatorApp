name: Build source-backed English Maya logogram gallery for Android
on:
  workflow_dispatch:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/logogram_expansion/build_android_meaning_gallery.py'
      - '.github/workflows/maya-android-english-logogram-gallery.yml'
permissions:
  contents: write
concurrency:
  group: maya-android-english-logogram-gallery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fyp-development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research package dependencies
        run: python -m pip install 'datasets>=4,<5' 'Pillow>=11,<13' 'numpy>=1.26,<3'
      - name: Export only source-backed logograms with licence and confidence checks
        run: |
          python -m py_compile ml/logogram_expansion/build_android_meaning_gallery.py
          python ml/logogram_expansion/build_android_meaning_gallery.py
      - name: Verify picture offsets, meanings, and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('app/src/main/assets')
          index=json.loads((root/'maya_twkm_logogram_index.json').read_text())
          bits=(root/'maya_twkm_logogram_bitmap.bin').read_bytes()
          assert index['format_version']==1
          assert len(bits)==index['count']*512
          assert len(set(r['sign'] for r in index['entries']))==index['meaning_sign_count']
          assert index['meaning_sign_count']>=50
          assert all(r['reading'] and r['english'] and
                     r['level'] in (1,2,3) for r in index['entries'])
          assert index['drawing_license']=='CC BY 4.0'
          print('LOGOGRAMS:',index['meaning_sign_count'],
                'ENGLISH SIGN MEANINGS; LICENSED DRAWINGS:', index['count'])
          PY
      - name: Add generated gallery to FYP code branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/maya_twkm_logogram_index.json app/src/main/assets/maya_twkm_logogram_bitmap.bin
          if git diff --cached --quiet; then
            echo 'English catalogue already up to date'
          else
            git commit -m "data: add CC BY licensed English logogram visual glossary"
            git push origin HEAD:fyp-development
          fi
      - name: Save source attribution and reproducible assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWKM-English-Meaning-Android-Asset-Pack
          path: |
            app/src/main/assets/maya_twkm_logogram_index.json
            app/src/main/assets/maya_twkm_logogram_bitmap.bin
          retention-days: 14
          if-no-files-found: warn
