name: Research v4 unknown-sign rejection calibration

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/calibrate_unknown.py'
      - '.github/workflows/research-v4-unknown-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned TWKM loader without modifying app model
        run: |
          mkdir -p ml/glyph_v4/outputs ml/glyph_v2
          git fetch --depth=1 origin glyph-v4-expanded-training
          git show FETCH_HEAD:ml/glyph_v4/train_v4.py > ml/glyph_v4/train_v4.py
          git fetch --depth=1 origin glyph-model-v2-experiment
          git show FETCH_HEAD:ml/glyph_v2/train.py > ml/glyph_v2/train.py
          git show FETCH_HEAD:ml/glyph_v2/train_transfer.py > ml/glyph_v2/train_transfer.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' opencv-python-headless scikit-learn scikit-image joblib onnxruntime
      - name: Run predeclared acceptance and rejection calibration
        run: python ml/research_v4_single/calibrate_unknown.py
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchV4UnknownSignMarginCalibration
          path: ml/research_v4_single/output/unknown_margin_calibration.json
          retention-days: 7
