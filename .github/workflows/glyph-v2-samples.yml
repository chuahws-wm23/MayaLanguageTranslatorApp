name: Package real TWKM glyph pictures for Android smoke tests
on:
  push:
    branches: [glyph-model-v2-experiment]
    paths:
      - 'ml/glyph_v2/create_test_samples.py'
      - '.github/workflows/glyph-v2-samples.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glyph-model-v2-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset and image processing
        run: python -m pip install 'datasets>=4.0,<5' 'Pillow>=11,<13'
      - name: Export source-checked TWKM gallery and individual images
        run: python ml/glyph_v2/create_test_samples.py
      - name: Commit only five actual reference PNGs and test ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v2/test_pictures/
          git commit -m 'Publish five attributed TWKM reference pictures for Android v2 smoke tests' || exit 0
          git push origin HEAD:glyph-model-v2-experiment
