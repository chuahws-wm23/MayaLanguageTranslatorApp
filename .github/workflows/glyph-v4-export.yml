name: Export ten-sign Maya glyph v4 to Android ONNX
on:
  push:
    branches: [glyph-v4-expanded-training]
    paths:
      - 'ml/glyph_v4/export_onnx.py'
      - '.github/workflows/glyph-v4-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glyph-v4-expanded-training
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch and ONNX
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime numpy
      - name: Export and verify the actual trained v4 checkpoint
        run: python ml/glyph_v4/export_onnx.py
      - name: Save the verified ONNX research model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ml/glyph_v4/outputs/android/
          git commit -m 'Store numerical-parity-checked ten-sign v4 ONNX model' || exit 0
          git push origin HEAD:glyph-v4-expanded-training
