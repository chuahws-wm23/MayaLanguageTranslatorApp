name: Build embedded TWKM 86-syllable offline Android catalogue
on:
  workflow_dispatch:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/syllabary_ml/build_android_phonogram_gallery.py'
      - '.github/workflows/maya-android-phonogram-gallery.yml'

permissions:
  contents: write

concurrency:
  group: maya-android-phonogram-gallery
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fyp-development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed research pipeline dependencies
        run: |
          python -m pip install 'datasets>=4,<5' 'Pillow>=11,<13' 'numpy>=1.26,<3'
      - name: Export licensed TWKM drawing references and their proposed phonogram labels
        run: |
          python -m py_compile ml/syllabary_ml/build_android_phonogram_gallery.py
          python ml/syllabary_ml/build_android_phonogram_gallery.py
      - name: Verify entry offsets, source metadata and sample labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('app/src/main/assets')
          obj=json.loads((base/'maya_twkm_phonogram_index.json').read_text())
          raw=(base/'maya_twkm_phonogram_bitmap.bin').read_bytes()
          assert obj['format_version']==1 and obj['side']==64
          assert len(raw)==obj['count']*obj['bytes_per_image']
          assert len(obj['entries'])==obj['count']
          assert len(set(x['syllable'] for x in obj['entries']))>=80
          assert all(x['twkm_sign']>0 for x in obj['entries'])
          assert all(len(x['sha256'])==64 for x in obj['entries'])
          assert obj['drawing_license']=='CC BY 4.0'
          print('LICENSED OFFLINE ASSETS OK:',obj['count'],'drawings,',len(obj['syllables']),'syllables')
          PY
      - name: Commit just the two small generated Android data assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/maya_twkm_phonogram_bitmap.bin app/src/main/assets/maya_twkm_phonogram_index.json
          if git diff --cached --quiet; then
            echo 'Generated catalogue unchanged'
          else
            git commit -m "data: embed CC BY TWKM proposed phonogram gallery"
            git push origin HEAD:fyp-development
          fi
      - name: Publish copy for auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maya-TWKM-86-Offline-Catalogue-Assets
          path: |
            app/src/main/assets/maya_twkm_phonogram_bitmap.bin
            app/src/main/assets/maya_twkm_phonogram_index.json
          if-no-files-found: warn
          retention-days: 14
