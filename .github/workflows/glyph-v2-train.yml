name: Train Maya glyph v2 on independent TWKM drawings
on:
  push:
    branches: [glyph-model-v2-experiment]
    paths:
      - 'ml/glyph_v2/train.py'
      - '.github/workflows/glyph-v2-train.yml'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible training tools
        run: python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' scikit-learn scikit-image opencv-python-headless joblib
      - name: Train on original sign drawings and measure held-out accuracy
        run: python ml/glyph_v2/train.py
      - name: Summarize genuine original-image results
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('ml/glyph_v2/outputs/evaluation.json'))
          summary='## Maya glyph v2 experiment\n\n'
          summary+=f"* **Held-out original drawing accuracy:** {x['heldout_correct']}/{x['heldout_test_original_count']} = {x['heldout_test_accuracy']:.1%}\n"
          summary+=f"* **Selected algorithm:** {x['selected_model']} (chosen using validation only)\n"
          summary+='* **Important:** This is five-sign closed-set classification of standardized TWKM drawings, not all-glyph or phone-photo accuracy.\n'
          open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(summary)
          print(summary)
          PY
      - name: Save research model and evaluation; do not modify main app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v2/outputs/
          git commit -m 'Record independently evaluated Maya glyph v2 model' || exit 0
          git push origin HEAD:glyph-model-v2-experiment
