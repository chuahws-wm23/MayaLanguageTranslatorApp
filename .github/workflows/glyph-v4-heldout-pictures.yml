name: Export v4 held-out TWKM pictures for Android regression tests
on:
  push:
    branches: [glyph-v4-expanded-training]
    paths:
      - 'ml/glyph_v4/create_heldout_testpack.py'
      - '.github/workflows/glyph-v4-heldout-pictures.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glyph-v4-expanded-training
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source image tools
        run: python -m pip install 'datasets>=4.0,<5' 'Pillow>=11,<13'
      - name: Verify original SHA256 and export ten known test drawings
        run: python ml/glyph_v4/create_heldout_testpack.py
      - name: Publish known test set for phone UI regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ml/glyph_v4/heldout_tests/
          git commit -m 'Publish ten source-verified v4 held-out Android smoke-test images' || exit 0
          git push origin HEAD:glyph-v4-expanded-training
