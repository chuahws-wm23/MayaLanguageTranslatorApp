name: Evaluate Maya glyph v3 unknown-sign rejection
on:
  push:
    branches: [glyph-v3-open-set-experiment]
    paths:
      - 'ml/glyph_v3/evaluate_open_set.py'
      - '.github/workflows/glyph-v3-eval.yml'
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glyph-v3-open-set-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned-data and evaluation tools
        run: python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' scikit-learn scikit-image opencv-python-headless joblib
      - name: Run unseen-original and sign-disjoint unknown evaluation
        run: python ml/glyph_v3/evaluate_open_set.py
      - name: Publish actual diagnostic metrics
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('ml/glyph_v3/outputs/evaluation.json'))
          s="## v3 experimental unknown-sign evaluation\n\n"
          s+=f"* Existing 5-sign classifier correct on original-image folds: {x['closed_set_known_correct']}/{x['closed_set_known_total']}\n"
          s+=f"* Correct and ACCEPTED known originals: {x['screened_correct_and_accepted_known']}/{x['screened_known_total']} = {x['screened_known_accuracy']:.1%}\n"
          s+=f"* Unknown TWKM sign rejection (100 sign-disjoint originals, reused across fold models): {x['unknown_rejection_mean_over_folds']:.1%}\n"
          s+=f"* Balanced known-correct/unknown-reject: {x['balanced_known_correct_plus_unknown_rejection']:.1%}\n"
          s+="* **Not a phone-photo benchmark, unknowns from same TWKM source as known positives**.\n"
          print(s);open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(s)
          PY
      - name: Commit v3 evaluation and small reference-embedding asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v3/outputs/
          git commit -m 'Record source-disjoint TWKM open-set evaluation and gallery embeddings' || exit 0
          git push origin HEAD:glyph-v3-open-set-experiment
