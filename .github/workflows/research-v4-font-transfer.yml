name: Research v4 two-stage font pretraining transfer test

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/train_font_transfer_v4.py'
      - '.github/workflows/research-v4-font-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Restore only pinned TWKM training preparation and baseline
        run: |
          mkdir -p ml/glyph_v4/outputs ml/glyph_v2
          git fetch --depth=1 origin glyph-v4-expanded-training
          git show FETCH_HEAD:ml/glyph_v4/train_v4.py > ml/glyph_v4/train_v4.py
          git show FETCH_HEAD:ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt > ml/glyph_v4/outputs/mobilenet_v4_finetuned.pt
          git fetch --depth=1 origin glyph-model-v2-experiment
          git show FETCH_HEAD:ml/glyph_v2/train.py > ml/glyph_v2/train.py
          git show FETCH_HEAD:ml/glyph_v2/train_transfer.py > ml/glyph_v2/train_transfer.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deep-learning libraries
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' opencv-python-headless scikit-learn scikit-image joblib kagglehub
      - name: Download Kaggle font images for auxiliary font-key training
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          path=Path(kagglehub.dataset_download('sayantanroy10121999/mayan-glyphs-dataset'))
          assert len(list(path.rglob("*.png")))>=15000
          Path('/tmp/kaggle_aux_dir').write_text(str(path))
          PY
      - name: Pretrain on font-key classes; fine tune verified TWKM ten signs
        run: |
          python ml/research_v4_single/train_font_transfer_v4.py \
            --kaggle-dir "$(cat /tmp/kaggle_aux_dir)" \
            --output ml/research_v4_single/transfer_output \
            --font-epochs 3 --twkm-epochs 8
      - name: Summarize class-identification performance
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('ml/research_v4_single/transfer_output/results.json'))
          a,b=r['baseline_validation'],r['transfer_candidate_validation']
          s=("## Research v4 font-transfer test\n\n"
             f"* Baseline TWKM validation: {a['clean_correct']}/{a['clean_total']}\n"
             f"* Transfer candidate validation: {b['clean_correct']}/{b['clean_total']}\n"
             f"* Baseline synthetic stress: {a['stress_correct']}/{a['stress_total']}\n"
             f"* Candidate synthetic stress: {b['stress_correct']}/{b['stress_total']}\n"
             f"* Candidate selected: {r['candidate_selected_by_validation']}\n"
             "* Kaggle font keys are not Maya meanings. Independent photo accuracy unmeasured.\n")
          print(s)
          open(os.environ['GITHUB_STEP_SUMMARY'],'a').write(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchV4FontTransferResearchComparison
          path: ml/research_v4_single/transfer_output/
          retention-days: 14
