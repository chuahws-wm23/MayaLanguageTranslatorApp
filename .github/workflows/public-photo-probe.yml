name: Public glyph photograph probe

on:
  workflow_dispatch:
  push:
    branches: [fyp-development]
    paths:
      - '.github/workflows/public-photo-probe.yml'
      - 'ml/logogram_expansion/public_photo_probe.py'
      - 'ml/logogram_expansion/photo_benchmark.py'
      - 'app/src/androidTest/java/com/chuahws/mayalanguageapp/presentation/translation/PublicGlyphPhotoProbeTest.kt'

permissions:
  contents: read

jobs:
  real-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download documented public-domain photographs without adding them to the model
        run: |
          python -m pip install Pillow==13.0.0
          python ml/logogram_expansion/public_photo_probe.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the actual Android photo loader and recognition flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python ml/logogram_expansion/public_photo_probe.py --run-android
      - name: Audit baseline and prepare unlabelled development review pack
        if: always()
        run: |
          python ml/logogram_expansion/photo_benchmark.py --manifest app/src/androidTest/assets/public_photo_probe/manifest.json --report public-photo-report.json --output public-photo-benchmark.json
          python ml/logogram_expansion/photo_benchmark.py --manifest app/src/androidTest/assets/public_photo_probe/manifest.json --photo-root app/src/androidTest/assets/public_photo_probe --output public-photo-review
          git rev-parse HEAD > evaluated-code-commit.txt
      - name: Preserve source photographs, hashes, predictions and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PublicGlyphPhotographProbe
          path: |
            public-photo-report.json
            public-photo-summary.json
            public-photo-benchmark.json
            public-photo-review/
            evaluated-code-commit.txt
            app/src/androidTest/assets/public_photo_probe/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
