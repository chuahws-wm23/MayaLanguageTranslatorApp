name: Public glyph photograph probe

on:
  workflow_dispatch:
  push:
    branches: [fyp-development]
    paths:
      - '.github/workflows/public-photo-probe.yml'
      - 'ml/logogram_expansion/public_photo_probe.py'
      - 'app/src/androidTest/java/com/chuahws/mayalanguageapp/presentation/translation/PublicGlyphPhotoProbeTest.kt'

permissions:
  contents: read

jobs:
  real-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download documented public-domain photographs without adding them to the model
        run: |
          python -m pip install Pillow==13.0.0
          python ml/logogram_expansion/public_photo_probe.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the actual Android photo loader and recognition flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            probe_exit=0
            gradle connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.chuahws.mayalanguageapp.presentation.translation.PublicGlyphPhotoProbeTest --stacktrace || probe_exit=$?
            adb pull /sdcard/Android/data/com.chuahws.mayalanguageapp/files/screenshots/public-photo-development-report.json public-photo-report.json || true
            if [ -f public-photo-report.json ]; then python ml/logogram_expansion/public_photo_probe.py --summarize public-photo-report.json; fi
            exit "$probe_exit"
      - name: Preserve source photographs, hashes, predictions and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PublicGlyphPhotographProbe
          path: |
            public-photo-report.json
            public-photo-summary.json
            app/src/androidTest/assets/public_photo_probe/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
