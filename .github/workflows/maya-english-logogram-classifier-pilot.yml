name: Compare English-glossed TWKM 20 and 30 class pretrained classifier
on:
  workflow_dispatch:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/logogram_expansion/english_classifier_pilot.py'
      - '.github/workflows/maya-english-logogram-classifier-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU vision research dependencies
        run: |
          python -m pip install -U pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy 'Pillow>=11,<13' scikit-learn
      - name: Train and evaluate heldout TWKM drawing variants
        run: python ml/logogram_expansion/english_classifier_pilot.py
      - name: Show evidence rather than claim real-phone accuracy
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("ml/logogram_expansion/output/english_logogram_20_30_classifier_pilot.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## English logogram source-drawing classifier study\n")
              if p.exists():
                  r=json.loads(p.read_text())
                  for count,group in r["results"].items():
                      out.write(f"{count} classes: top-1 {group['correct_top1']}/{group['heldout_source_graph_variants']}, top-3 {group['correct_top3']}/{group['heldout_source_graph_variants']}  \n")
                  out.write("**No Android classifier update or real-photo accuracy claim.**\n")
              else:
                  out.write("Pilot did not complete.\n")
          PY
      - name: Save evaluated results and selected source sign IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWKM-English-20-30-Class-Classifier-Study
          path: ml/logogram_expansion/output/english_logogram_20_30_classifier_pilot.json
          if-no-files-found: warn
          retention-days: 14
