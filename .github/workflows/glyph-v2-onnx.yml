name: Convert trained Maya glyph v2 to ONNX for offline Android
on:
  push:
    branches: [glyph-model-v2-experiment]
    paths:
      - 'ml/glyph_v2/export_onnx.py'
      - '.github/workflows/glyph-v2-onnx.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and conversion libraries
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime 'skl2onnx>=1.18' scikit-learn joblib numpy
      - name: Export actual trained weights; assert PyTorch and sklearn parity
        run: python ml/glyph_v2/export_onnx.py
      - name: Commit verified ONNX assets to research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml/glyph_v2/outputs/android/
          git commit -m 'Save parity-checked offline Maya glyph v2 ONNX assets' || exit 0
          git push origin HEAD:glyph-model-v2-experiment
