name: Evaluate Research v4 class differentiation

on:
  push:
    branches: [fyp-development]
    paths:
      - 'ml/research_v4_single/evaluate_v4_ranking.py'
      - '.github/workflows/research-v4-differentiation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore original pinned research preprocessing and source split
        run: |
          mkdir -p ml/glyph_v4/outputs ml/glyph_v2
          git fetch --depth=1 origin glyph-v4-expanded-training
          git show FETCH_HEAD:ml/glyph_v4/train_v4.py > ml/glyph_v4/train_v4.py
          git fetch --depth=1 origin glyph-model-v2-experiment
          git show FETCH_HEAD:ml/glyph_v2/train.py > ml/glyph_v2/train.py
          git show FETCH_HEAD:ml/glyph_v2/train_transfer.py > ml/glyph_v2/train_transfer.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline inference/evaluation libraries
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5' 'pillow>=11,<13' opencv-python-headless scikit-learn scikit-image joblib onnxruntime
      - name: Evaluate all ten classes and top-three candidates
        run: python ml/research_v4_single/evaluate_v4_ranking.py
      - name: Publish summary
        run: cat ml/research_v4_single/metrics/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchV4PerGlyphConfusionAndTop3
          path: ml/research_v4_single/metrics/
          retention-days: 14
