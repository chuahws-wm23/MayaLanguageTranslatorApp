name: Dataset checks

on:
  push:
    branches:
      - fyp-development
    paths:
      - 'dataset/**'
      - 'docs/DATA_SOURCES.md'
      - '.github/workflows/dataset.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dataset/**'
      - 'docs/DATA_SOURCES.md'
      - '.github/workflows/dataset.yml'
  workflow_dispatch:

jobs:
  build-dictionary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download current Kaikki Yucatec Maya data
        run: python dataset/scripts/download_kaikki.py

      - name: Convert dictionary
        run: |
          python dataset/scripts/convert_kaikki.py \
            dataset/raw/kaikki-yucatec-maya.jsonl \
            dataset/processed/maya_english_dictionary.csv

      - name: Validate dictionary
        run: |
          python dataset/scripts/validate_dictionary.py \
            dataset/processed/maya_english_dictionary.csv \
            --report dataset/processed/validation_report.json

      - name: Prepare evaluation candidates
        run: |
          python dataset/scripts/prepare_evaluation_sample.py \
            dataset/processed/maya_english_dictionary.csv \
            dataset/evaluation/manual_evaluation_candidates.csv \
            --size 200

      - name: Audit dictionary ambiguity
        run: |
          python dataset/scripts/audit_dictionary.py \
            dataset/processed/maya_english_dictionary.csv \
            --report dataset/processed/dictionary_audit.json

      - name: Score independent reference coverage
        run: |
          python dataset/scripts/score_reference_candidates.py \
            dataset/processed/maya_english_dictionary.csv \
            dataset/evaluation/independent_reference_candidates.csv \
            --report dataset/evaluation/independent_reference_coverage.json

      - name: Upload processed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: yucatec-maya-dictionary
          if-no-files-found: error
          retention-days: 30
          path: |
            dataset/processed/maya_english_dictionary.csv
            dataset/processed/validation_report.json
            dataset/processed/dictionary_audit.json
            dataset/raw/kaikki-yucatec-maya.metadata.json
            dataset/evaluation/manual_evaluation_candidates.csv
            dataset/evaluation/independent_reference_coverage.json
